# ==============================
# CORS CONFIG
# ==============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ==============================
# AI BACKEND
# ==============================
ai.backend.url=${AI_BACKEND_URL:http://localhost:5000}

# ==============================
# APP INFO (for emails)
# ==============================
app.name=SmartFix

# ==============================
# TECHNICIAN ASSIST (CBR knowledge base)
# ==============================
# Synthetic demo repair_cases — off by default so recommendations use real shop data only.
smartfix.seed-sample-repair-cases=false
# When a repair task status becomes COMPLETED, create a repair_cases row if missing (symptoms from task, diagnosis from linked Diagnosis if any).
smartfix.auto-sync-repair-case-on-complete=true

# Case ranking (normalized to sum = 1)
smartfix.assist.rank-weight-jaccard=0.35
smartfix.assist.rank-weight-cosine=0.65
# Pattern mining minimum support (raised with corpus size in detector)
smartfix.pattern.min-support=2