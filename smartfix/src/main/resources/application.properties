server.port=8080

# ==============================
# DATABASE CONFIG
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartfix_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Didace@2023}

# ==============================
# JPA CONFIG
# ==============================
spring.jpa.hibernate.ddl-auto=update
# Set JPA_SHOW_SQL=true in the environment to log every SQL statement (verbose on dashboard load)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# EMAIL (SMTP - GMAIL)
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ishimwedoku@gmail.com
spring.mail.password=zmpkfxpbftlfhtaa

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeout (important to avoid hanging)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
